# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# Creates a free Postgres database and a Docker web service wired to it.
databases:
  - name: margin-db
    plan: free
    databaseName: margin
    user: margin

services:
  - type: web
    name: margin
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: margin-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      # Optional: create a 'demo' user on every start. Set DEMO_PASSWORD in the Render
      # dashboard (never in this file) and turn SEED_DEMO to "1".
      - key: SEED_DEMO
        value: "0"
