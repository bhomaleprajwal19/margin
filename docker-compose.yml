# Production-like stack on your machine: Django + React in one container, MySQL alongside.
#   docker compose up --build      ->  http://localhost:8000
# Local development only: these credentials are throwaway values for a database that is
# not exposed outside your machine. Never reuse them for a real deployment.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: margin
      MYSQL_USER: margin
      MYSQL_PASSWORD: margin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umargin", "-pmargin"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://margin:margin@db:3306/margin
      DJANGO_SECRET_KEY: local-docker-secret-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DJANGO_SSL_REDIRECT: "0"
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
